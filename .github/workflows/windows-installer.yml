name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install -c constraints.txt -r requirements-build.txt
          python -m pip install --no-build-isolation -c constraints.txt -e .
      - name: Build Windows application
        run: python build.py
      - name: Verify packaged application launches
        run: python packaging/check_windows_startup.py --exe outputs/AIPlayer/AIPlayer.exe --report-root work/portable-startup
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $tool
          $expected = '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'
          if ((Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Compiler SHA256 mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $tool -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$directory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Compiler installation failed: $($process.ExitCode)" }
          "ISCC_PATH=$directory\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Create installer
        run: python packaging/build_installer.py
      - name: Verify installed application launches
        run: python packaging/check_windows_startup.py --installer outputs/AIPlayer-0.2.1-Windows-x64-Setup.exe --report-root work/installed-startup
      - name: Record successful launch verification
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('outputs/windows-installer.json')
          data = json.loads(path.read_text())
          data['runtime_tested'] = True
          data['startup_checks'] = ['portable', 'installed-clean-profile-cyrillic-path']
          path.write_text(json.dumps(data, indent=2))
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-startup-verification
          path: |
            work/*-startup/*.log
            work/*-startup/*.json
            work/*-startup/*.png
            work/*-startup/*.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AIPlayer-Windows-installer
          retention-days: 14
          compression-level: 0
          path: |
            outputs/*-Setup.exe
            outputs/windows-installer.json
            outputs/SHA256SUMS.txt
