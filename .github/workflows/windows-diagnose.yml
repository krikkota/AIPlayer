name: Diagnose installed Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download exact shipped installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43955651055 --repo krikkota/AIPlayer --name AIPlayer-Windows-installer --dir previous-release
      - name: Verify installer and reproduce startup
        shell: pwsh
        run: |
          $file = 'previous-release/AIPlayer-0.2.0-Windows-x64-Setup.exe'
          if ((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd0e834954a0e8fe401396f39ce96e5bc6dd91c0a053ee9afbf0acb58addf8ede') { throw 'Installer checksum mismatch' }
          python packaging/check_windows_startup.py --installer $file --report-root work/windows-repro
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Windows-startup-reproduction
          path: |
            work/windows-repro/*.log
            work/windows-repro/*.json
            work/windows-repro/*.txt
            work/windows-repro/*.png
