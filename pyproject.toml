[project]
name = "local-media-player"
version = "0.2.2"
description = "Local desktop media player with GigaAM transcripts and Ollama search"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0",
  "numpy==2.5.4", "onnxruntime==1.31.1", "onnx-asr==0.12.0",
  "soundfile==0.14.0", "imageio-ffmpeg==0.8.1", "tokenizers==0.23.3",
]

[project.scripts]
local-player = "player.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
player = ["qml/*.qml", "assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.icns", "assets/fonts/*.ttf", "assets/icons/*.svg"]

[tool.setuptools.packages.find]
include = ["player*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

