name: Linux package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install desktop runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libxcb-cursor0 libxcb-keysyms1 libxcb-xinerama0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-render-util0 libxcb-util1 libxcb-shape0 libxcb-xinput0 libopengl0
      - name: Install build dependencies
        run: |
          python -m pip install -c constraints.txt -r requirements-build.txt
          python -m pip install --no-build-isolation -c constraints.txt -e .
      - name: Build portable Linux package
        run: python build.py
      - name: Open packaged application from extracted archive
        run: |
          mkdir -p 'work/linux-check/Распакованный плеер'
          report="$PWD/work/linux-check"
          tar -xzf "$(find outputs -maxdepth 1 -name 'AIPlayer-[0-9]*-Linux-x64.tar.gz' -print -quit)" -C "$report/Распакованный плеер"
          export QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software AIPLAYER_STARTUP_CHECK=1
          export AIPLAYER_STARTUP_LOG="$report/startup.log"
          timeout 45s xvfb-run -a "$report/Распакованный плеер/AIPlayer/AIPlayer" --data-dir "$report/Чистые настройки" --onboarding --screenshot "$report/first-window.png" --quit-after 5500 --mute
          grep -q '^EXIT 0' "$report/startup.log"
          python - <<'PY'
          from pathlib import Path
          from struct import unpack
          path = Path("work/linux-check/first-window.png")
          with path.open("rb") as stream:
              header = stream.read(24)
          assert header[:8] == b"\x89PNG\r\n\x1a\n" and min(unpack(">II", header[16:24])) >= 300, header
          PY
      - name: Verify SaT INT8 on Linux CPU
        run: python packaging/check_segmentation_runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Linux-startup-verification
          path: |
            work/linux-check/*.log
            work/linux-check/*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AIPlayer-Linux-package
          compression-level: 0
          path: |
            outputs/AIPlayer-[0-9]*-Linux-x64.tar.gz
            outputs/release.json
            outputs/SHA256SUMS.txt
